name: Build Android Weather App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Prepare Clean Manifest & Resources
        run: |
          # در صورت وجود پوشه تو در تو فایل‌ها جابجا می‌شوند
          if [ -d "AuraWeather-main" ]; then
            shopt -s dotglob nullglob
            mv AuraWeather-main/* . 2>/dev/null || true
          fi

          # ساخت پوشه‌های ضروری
          mkdir -p app/src/main/res/values

          # ساخت فایل مانیفست تمیز و بدون ارور (جایگزین کردن فایل قبلی)
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:label="AuraWeather"' \
            '        android:supportsRtl="true"' \
            '        android:theme="@android:style/Theme.Material.NoActionBar">' \
            '        <activity' \
            '            android:name="com.weather.aura.MainActivity"' \
            '            android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          # ایجاد تنظیمات گریدل
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' > gradle.properties

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraWeather-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
